default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  port: 5432



development:
  <<: *default
  database: backend_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: backend_test

# Store production database in the standard manner for Postgres.
# To deploy with Kamal, ensure your environment variables are set.
production:
  primary:
    <<: *default
    database: backend_production
  cache:
    <<: *default
    database: backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: backend_production_cable
    migrations_paths: db/cable_migrate
